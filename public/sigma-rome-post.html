<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
body{width:1080px;height:1080px;overflow:hidden;background:#0d0f0e}
.root{width:1080px;height:1080px;position:relative;overflow:hidden;background:linear-gradient(140deg,#1a1210 0%,#0d0f0e 50%,#1a1613 100%)}

/* ── PHOTO PANEL ── */
.photo-panel{
  position:absolute;left:0;top:0;
  width:600px;height:916px;
  clip-path:polygon(0 0,100% 0,80% 100%,0 100%);
  overflow:hidden
}
.photo-panel img{
  width:100%;height:100%;
  object-fit:cover;object-position:center;
  display:block;
  filter:brightness(0.65) saturate(0.8) contrast(1.05)
}
.photo-ov{position:absolute;inset:0;background:linear-gradient(90deg,rgba(13,15,14,.08) 0%,rgba(13,15,14,.3) 55%,rgba(13,15,14,.88) 100%)}
.photo-tint{position:absolute;inset:0;background:rgba(217,119,87,.07)}
.photo-top{position:absolute;top:0;left:0;right:0;height:100px;background:linear-gradient(to bottom,rgba(26,18,16,.5) 0%,transparent 100%)}

/* ── DIAGONAL ACCENT LINES ── */
.diag{position:absolute;left:0;top:0;width:1080px;height:916px;pointer-events:none}

/* ── TEXT PANEL ── */
.text-panel{
  position:absolute;top:0;left:510px;right:0;height:916px;
  display:flex;flex-direction:column;justify-content:center;
  padding:60px 56px 60px 90px;
  background:linear-gradient(90deg,transparent 0%,rgba(26,18,16,.9) 28%,#1a1210 100%)
}
.badge{
  display:inline-flex;align-items:center;gap:8px;
  background:rgba(217,119,87,.1);border:1px solid rgba(217,119,87,.28);
  border-radius:6px;padding:6px 14px;margin-bottom:30px;width:fit-content
}
.badge-dot{width:6px;height:6px;border-radius:50%;background:#d97757;flex-shrink:0}
.badge-text{font-family:'Inter',sans-serif;font-size:11px;font-weight:600;letter-spacing:2.5px;color:rgba(217,119,87,.9);text-transform:uppercase}
.eyebrow{font-family:'Inter',sans-serif;font-size:20px;font-weight:500;letter-spacing:7px;color:rgba(250,250,247,.55);text-transform:uppercase;margin-bottom:14px}
.headline{font-family:'Inter',sans-serif;font-weight:800;font-size:82px;line-height:.93;letter-spacing:-3px;margin-bottom:34px}
.h-w{color:#fafaf7;display:block}
.h-t{color:#d97757;display:block}
.divider{width:60px;height:3px;background:#d97757;margin-bottom:30px;border-radius:2px}
.info-row{display:flex;align-items:center;gap:14px;margin-bottom:18px}
.info-date{font-family:'Inter',sans-serif;font-size:26px;font-weight:600;color:#fafaf7;letter-spacing:.5px}
.info-venue{font-family:'Inter',sans-serif;font-size:20px;font-weight:500;color:rgba(250,250,247,.72);letter-spacing:.5px}

/* ── ROME SKYLINE ── */
.skyline{position:absolute;left:0;width:1080px;bottom:64px;height:160px}

/* ── FOOTER ── */
.footer{
  position:absolute;left:0;bottom:0;width:1080px;height:64px;
  background:rgba(10,12,11,.97);border-top:1px solid rgba(217,119,87,.14);
  display:flex;align-items:center;justify-content:space-between;padding:0 44px
}
.logo-w{display:flex;align-items:center;font-family:'Inter',sans-serif;font-size:22px;font-weight:800;letter-spacing:-.5px;color:#fafaf7}
.logo-dot{width:6px;height:6px;border-radius:50%;background:#d97757;margin-left:3px;margin-bottom:-3px;display:inline-block}
.footer-url{font-family:'JetBrains Mono',monospace;font-size:14px;font-weight:500;color:rgba(217,119,87,.75);letter-spacing:.3px}
</style>
</head>
<body>
<div class="root">

<!-- Background -->
<div style="position:absolute;inset:0;background:linear-gradient(140deg,#1a1210 0%,#0d0f0e 50%,#1a1613 100%)"></div>

<!-- Terracotta background glow (right side) -->
<div style="position:absolute;bottom:-200px;right:-150px;width:600px;height:600px;border-radius:50%;background:radial-gradient(circle,rgba(217,119,87,.14) 0%,transparent 65%)"></div>

<!-- Photo panel -->
<div class="photo-panel">
  <img src="https://images.unsplash.com/photo-1540575467063-178a50c2df87?w=1400&q=85&fit=crop" alt="Conference networking" crossorigin="anonymous">
  <div class="photo-ov"></div>
  <div class="photo-tint"></div>
  <div class="photo-top"></div>

<!-- Diagonal accent lines -->

      <rect x="7" y="16" width="2.5" height="2.5" rx=".5" fill="#d97757"/>
    </svg>
    <span class="info-date">2–5 NOV 2026</span>
  </div>
  <div class="info-row">
    <svg width="26" height="26" viewBox="0 0 24 24" fill="none" style="flex-shrink:0">

      <circle cx="12" cy="8" r="2" stroke="#d97757" stroke-width="2"/>

</div>

<!-- Footer -->
<div class="footer">
  <div class="logo-w">CascadX<span class="logo-dot"></span></div>
  <div class="footer-url">cascadx.com/rob</div>
</div>
