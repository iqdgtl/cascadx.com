<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
body{width:1080px;height:1920px;overflow:hidden;background:#0d0f0e}
.root{width:1080px;height:1920px;position:relative;overflow:hidden;background:#0d0f0e}

/* ── PHOTO (top half) ── */
.photo-wrap{position:absolute;left:0;top:0;width:1080px;height:940px;overflow:hidden}
.photo-wrap img{width:100%;height:100%;object-fit:cover;object-position:center 30%;filter:brightness(.62) saturate(.8) contrast(1.05)}
.photo-ov{position:absolute;inset:0;background:linear-gradient(180deg,rgba(13,15,14,.15) 0%,rgba(13,15,14,.25) 60%,rgba(13,15,14,.95) 100%)}
.photo-tint{position:absolute;inset:0;background:rgba(217,119,87,.06)}
.photo-top{position:absolute;top:0;left:0;right:0;height:120px;background:linear-gradient(to bottom,rgba(13,15,14,.6) 0%,transparent 100%)}

/* Diagonal accent lines on photo */
.photo-diag{position:absolute;left:0;top:0;width:1080px;height:940px;pointer-events:none}

/* ── TEXT SECTION ── */
.text-section{
  position:absolute;left:0;right:0;top:850px;
  padding:0 80px;
  display:flex;flex-direction:column;align-items:flex-start
}
.badge{
  display:inline-flex;align-items:center;gap:10px;
  background:rgba(217,119,87,.1);border:1px solid rgba(217,119,87,.28);
  border-radius:8px;padding:8px 18px;margin-bottom:28px;width:fit-content
}
.badge-dot{width:7px;height:7px;border-radius:50%;background:#d97757;flex-shrink:0}
.badge-text{font-family:'Inter',sans-serif;font-size:12px;font-weight:600;letter-spacing:2.5px;color:rgba(217,119,87,.9);text-transform:uppercase}
.eyebrow{font-family:'Inter',sans-serif;font-size:24px;font-weight:500;letter-spacing:8px;color:rgba(250,250,247,.55);text-transform:uppercase;margin-bottom:16px}
.headline{font-family:'Inter',sans-serif;font-weight:800;font-size:100px;line-height:.92;letter-spacing:-4px;margin-bottom:40px}
.h-w{color:#fafaf7;display:block}
.h-t{color:#d97757;display:block}
.divider{width:70px;height:3px;background:#d97757;margin-bottom:36px;border-radius:2px}
.info-row{display:flex;align-items:center;gap:16px;margin-bottom:22px}
.info-date{font-family:'Inter',sans-serif;font-size:32px;font-weight:600;color:#fafaf7;letter-spacing:.5px}
.info-venue{font-family:'Inter',sans-serif;font-size:26px;font-weight:500;color:rgba(250,250,247,.72);letter-spacing:.5px}

/* ── QR + CTA ── */
.qr-section{
  position:absolute;left:80px;right:80px;bottom:246px;
  display:flex;align-items:center;gap:40px
}
.qr-box{
  width:160px;height:160px;background:#0d0f0e;
  border:2px solid rgba(217,119,87,.3);border-radius:16px;
  display:flex;align-items:center;justify-content:center;flex-shrink:0;overflow:hidden
}
.qr-box img{width:148px;height:148px}
.qr-text-wrap{display:flex;flex-direction:column;gap:8px}
.qr-label{font-family:'Inter',sans-serif;font-size:14px;font-weight:500;letter-spacing:2px;color:rgba(250,250,247,.45);text-transform:uppercase}
.qr-url{font-family:'JetBrains Mono',monospace;font-size:22px;font-weight:500;color:rgba(217,119,87,.9)}
.qr-sub{font-family:'Inter',sans-serif;font-size:16px;font-weight:400;color:rgba(250,250,247,.4)}

/* ── ROME SKYLINE ── */
.skyline{position:absolute;left:0;width:1080px;bottom:70px;height:174px}

/* ── FOOTER ── */
.footer{
  position:absolute;left:0;bottom:0;width:1080px;height:70px;
  background:rgba(10,12,11,.97);border-top:1px solid rgba(217,119,87,.14);
  display:flex;align-items:center;justify-content:space-between;padding:0 50px
}
.logo-w{display:flex;align-items:center;font-family:'Inter',sans-serif;font-size:26px;font-weight:800;letter-spacing:-.5px;color:#fafaf7}
.logo-dot{width:7px;height:7px;border-radius:50%;background:#d97757;margin-left:3px;margin-bottom:-3px;display:inline-block}
.footer-url{font-family:'JetBrains Mono',monospace;font-size:16px;font-weight:500;color:rgba(217,119,87,.75)}

/* Logo top overlay on photo */
.top-logo{
  position:absolute;left:80px;top:72px;
  display:flex;align-items:center;
  font-family:'Inter',sans-serif;font-size:28px;font-weight:800;letter-spacing:-.5px;color:#fafaf7
}
.top-logo-dot{width:8px;height:8px;border-radius:50%;background:#d97757;margin-left:3px;margin-bottom:-4px;display:inline-block}
</style>
</head>

<!-- QR code + CTA section -->
<div class="qr-section">

    <img src="https://api.qrserver.com/v1/create-qr-code/?size=148x148&data=https%3A%2F%2Fcascadx.com%2Frob&color=d97757&bgcolor=0d0f0e&margin=2" alt="QR" crossorigin="anonymous">

  <div class="qr-text-wrap">
    <div class="qr-label">Book a meeting</div>
    <div class="qr-url">cascadx.com/rob</div>
    <div class="qr-sub">Scan to connect with Robi Guetta</div>
  </div>
</div>

<!-- Separator line above skyline -->
<div style="position:absolute;left:50px;right:50px;bottom:244px;height:1px;background:linear-gradient(90deg,transparent,rgba(217,119,87,.25) 30%,rgba(217,119,87,.25) 70%,transparent)"></div>

<!-- Footer -->
